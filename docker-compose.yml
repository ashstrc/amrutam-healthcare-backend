version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: amrutam-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashmit123
      POSTGRES_DB: amrutam_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: amrutam-backend
    restart: always

    depends_on:
      - postgres

    ports:
      - "4000:4000"

    env_file:
      - .env.docker

volumes:
  postgres_data: